name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare version to registry
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/cloudfault/package.json').version")
          REGISTRY_VERSION=$(npm view @gmacko/cloudfault version 2>/dev/null || echo "0.0.0")
          echo "@gmacko/cloudfault — local: $LOCAL_VERSION, registry: $REGISTRY_VERSION"

          SHOULD_RELEASE=false
          if [ "$LOCAL_VERSION" != "$REGISTRY_VERSION" ]; then
            SHOULD_RELEASE=true
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm 10 (bundled with Node 22) crashes resolving the vitest peer set
      # ("Cannot read properties of null (reading 'edgesOut')"). npm 11 resolves
      # it; deps stay unpinned so upstream drift is still caught.
      - name: Upgrade npm
        run: npm install --global npm@11 && npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check workspace versions are in sync
        run: npm run check-versions

      - name: Test
        run: npm test

      # Only @gmacko/cloudfault is published. The @cloudfault/* workspace
      # packages are private and are folded into its dist/ by
      # scripts/build-package.mjs, so they never need to exist on npm.
      # Publishing is interactive (npm login + 2FA), not a CI token: npm is
      # retiring long-lived publish tokens. This job only produces the tested
      # tarball; see "Releasing" in docs/releasing.md.
      - name: Pack @gmacko/cloudfault
        id: pack
        run: |
          TARBALL=$(npm pack --workspace @gmacko/cloudfault --pack-destination "$RUNNER_TEMP" | tail -1)
          echo "tarball=$RUNNER_TEMP/$TARBALL" >> "$GITHUB_OUTPUT"
          shasum "$RUNNER_TEMP/$TARBALL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: gmacko-cloudfault-${{ needs.check-release.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Publishing instructions
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          {
            echo "## @gmacko/cloudfault ${VERSION} is ready to publish"
            echo
            echo "Download the \`gmacko-cloudfault-${VERSION}\` artifact, then:"
            echo
            echo '```'
            echo "npm login --registry https://registry.npmjs.org/"
            echo "npm publish gmacko-cloudfault-${VERSION}.tgz --access public --registry https://registry.npmjs.org/"
            echo '```'
            echo
            echo "Then tag the commit \`v${VERSION}\`. See docs/releasing.md."
          } >> "$GITHUB_STEP_SUMMARY"

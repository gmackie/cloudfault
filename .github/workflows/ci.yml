name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10 (bundled with Node 22) crashes resolving the vitest peer set
      # ("Cannot read properties of null (reading 'edgesOut')"). npm 11 resolves
      # it; deps stay unpinned so upstream drift is still caught.
      - run: npm install --global npm@11
      - run: npm --version
      - run: npm install --no-audit --no-fund
      - run: npm run check-versions
      - run: npm test
      # Dogfood the composite action: gate on a suite that must pass every
      # applicable scenario, and fail the job if a budget cuts it short.
      - name: CloudFault gate
        uses: ./
        with:
          targets: examples/ci-gate
          seed: ${{ github.run_number }}
          strict: "true"
      - run: npm pack --workspace @gmacko/cloudfault --dry-run
